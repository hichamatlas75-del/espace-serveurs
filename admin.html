<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Grey Corner — Admin Console</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="admin.css"/>

</head>

<body>

<!-- 🔴 FROZEN OVERLAY -->
<div id="systemFreezeOverlay" class="system-freeze-overlay hidden">
    <div class="freeze-box">
        <div class="freeze-title">SYSTÈME GELÉ</div>
        <div class="freeze-text">Les commandes et appels sont temporairement désactivés (rush mode actif)</div>
    </div>
</div>

<div class="admin-container">

    <!-- HEADER -->
    <header class="admin-header">
        <div>
            <span class="brand-title">Grey Corner</span>
            <span class="admin-badge">Admin</span>
            <span id="connectionPill" class="connection-pill connected"></span>
            <span id="connectionLabel" class="connection-label">LIVE</span>
        </div>

        <div style="display:flex; gap:12px; align-items:center;">
            <button id="toggleFreezeBtn" class="freeze-btn">Freeze OFF</button>
            <button id="dbCleanupBtn" class="cleanup-btn">Purger</button>
        </div>
    </header>

    <!-- KPI -->
    <div class="metrics-grid">

        <div class="metric-card">
            <div class="metric-info">
                <span class="metric-label">Tables actives</span>
                <span class="metric-val" id="metricActiveTables">0</span>
            </div>
        </div>

        <div class="metric-card">
            <div class="metric-info">
                <span class="metric-label">Appels</span>
                <span class="metric-val" id="metricPendingCalls">0</span>
            </div>
        </div>

        <div class="metric-card">
            <div class="metric-info">
                <span class="metric-label">Commandes</span>
                <span class="metric-val" id="metricActiveOrders">0</span>
            </div>
        </div>

    </div>

    <!-- TABLES -->
    <div class="dashboard-split">

        <div class="split-left">

            <div class="admin-zones-wrapper">
                <div class="admin-zone-card">
                    <div class="admin-zone-header">Salon</div>
                    <div id="gridSalon" class="table-matrix-grid"></div>
                </div>

                <div class="admin-zone-card">
                    <div class="admin-zone-header">Loge</div>
                    <div id="gridLoge" class="table-matrix-grid"></div>
                </div>

                <div class="admin-zone-card">
                    <div class="admin-zone-header">Terrasse</div>
                    <div id="gridTerrasse" class="table-matrix-grid"></div>
                </div>
            </div>

        </div>

        <div class="split-right">
            <div class="panel-header" style="display:flex; justify-content:space-between; align-items:center;">
                <div class="admin-tabs-nav">
                    <h2 class="admin-tab-btn active" data-tab="adminLiveTab">Live Feed</h2>
                    <h2 class="admin-tab-btn" data-tab="adminHistoryTab">Historique</h2>
                </div>
            </div>
            
            <div id="adminLiveTab" class="admin-tab-panel active">
                <div id="adminLiveActivityFeed" class="live-activity-feed"></div>
            </div>
            
            <div id="adminHistoryTab" class="admin-tab-panel" style="display:none;">
                <div id="adminHistoryFeed" class="live-activity-feed"></div>
            </div>
        </div>

    </div>

</div>

<!-- Firebase SDK (Compat Mode for smooth global script tag inclusion) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=1.1"></script>
<script src="admin.js?v=1.1"></script>

</body>
</html>
