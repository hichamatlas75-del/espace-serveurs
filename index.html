<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Grey Corner — Point d'accès Serveurs</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>

    <style>
        /* ── Variables & Thème Sombre de Luxe ─────────────────────────────────── */
        :root {
            --bg: #07060a;
            --surface: #111118;
            --surface-2: #18181f;
            --gold: #C9A96E;
            --gold-dark: #A48332;
            --text: #F8F9FA;
            --muted: rgba(240, 234, 216, 0.45);
            --border: rgba(201, 169, 110, .12);
            --border-hover: rgba(201, 169, 110, .28);
            --error: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* ── Conteneur du Pont / Formulaire ─────────────────────────────────── */
        .bridge-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s ease;
        }

        .bridge-container:focus-within {
            border-color: var(--border-hover);
        }

        .brand-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 35px;
        }

        /* ── Formulaire & Inputs ───────────────────────────────────────────── */
        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .pin-input {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
            font-size: 1.2rem;
            color: var(--text);
            text-align: center;
            letter-spacing: 4px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .pin-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(201, 169, 110, 0.1);
        }

        /* ── Bouton d'action Doré ───────────────────────────────────────────── */
        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border: none;
            border-radius: 8px;
            padding: 15px;
            color: #000;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            margin-top: 10px;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .action-btn:hover {
            opacity: 0.95;
        }

        /* ── Messages d'Erreur & Statuts ────────────────────────────────────── */
        .error-msg {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="bridge-container">
        <div class="brand-logo">Grey Corner</div>
        <div class="brand-subtitle">Espace Serveurs</div>

        <form id="bridgeForm" onsubmit="handleAccess(event)">
            <div class="form-group">
                <label class="form-label" for="waiterPin">Code d'accès Équipe</label>
                <input 
                    type="password" 
                    id="waiterPin" 
                    class="pin-input" 
                    placeholder="••••" 
                    inputmode="numeric" 
                    pattern="[0-9]*" 
                    maxlength="6" 
                    autocomplete="current-password"
                    required
                />
            </div>

            <button type="submit" class="action-btn">Se connecter au Hub</button>
            <div id="errorZone" class="error-msg">Code d'accès incorrect. Veuillez réessayer.</div>
        </form>
    </div>

    <script>
        // Configuration du code d'accès de sécurité pour l'équipe Grey Corner
        // Vous pouvez changer "1234" par le code PIN de votre choix
        const ACCESS_PIN = "1234"; 

        function handleAccess(event) {
            event.preventDefault();
            
            const pinInput = document.getElementById("waiterPin");
            const errorZone = document.getElementById("errorZone");
            
            if (pinInput.value === ACCESS_PIN) {
                errorZone.style.display = "none";
                
                // Stocke temporairement une session pour éviter de bloquer l'accès en cas de refresh
                sessionStorage.setItem("gc_authenticated", "true");
                
                // Redirection fluide vers l'interface waiter.html présente sur votre Cloudflare Pages
                window.location.href = "waiter.html";
            } else {
                // Animation et affichage en cas d'erreur
                errorZone.style.display = "block";
                pinInput.value = "";
                pinInput.focus();
            }
        }

        // Optionnel : Si l'utilisateur est déjà authentifié dans cette session, on le redirige directement
        if (sessionStorage.getItem("gc_authenticated") === "true") {
            window.location.href = "waiter.html";
        }
    </script>

</body>
</html>
