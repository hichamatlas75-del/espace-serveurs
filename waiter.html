<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grey Corner — Espace Serveurs</title>

    <!-- Design system : Cormorant Garamond + DM Sans (aligné avec tout l'écosystème GC) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="waiter.css">

    <style>
        /* ── Reset & Variables ───────────────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #07060a;
            --surface: #111118;
            --surface-2: #18181f;
            --border: rgba(201, 169, 110, .12);
            --border-hover: rgba(201, 169, 110, .28);
            --gold: #C9A96E;
            --gold-light: #e2c98a;
            --gold-dim: rgba(201, 169, 110, .14);
            --alert: #e05252;
            --alert-dim: rgba(224, 82, 82, .14);
            --order: #6eaec9;
            --order-dim: rgba(110, 174, 201, .14);
            --success: #6ec99a;
            --success-dim: rgba(110, 201, 154, .14);
            --muted: rgba(255, 255, 255, .35);
            --text: rgba(255, 255, 255, .88);
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'DM Sans', sans-serif;
            --radius: 14px;
            --radius-sm: 9px;

            /* Safe area pour les appareils avec encoche / home bar */
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.6;
            min-height: 100dvh;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── Grain overlay (identique aux autres apps GC) ────────────────── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            opacity: .025;
        }

        /* ── App container ───────────────────────────────────────────────── */
        .app-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
            max-width: 600px;
            margin: 0 auto;
        }

        /* ── Header ──────────────────────────────────────────────────────── */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: calc(14px + var(--safe-top)) 18px 14px;
            border-bottom: 1px solid var(--border);
            background: rgba(7, 6, 10, .85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .brand-title {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: .16em;
            color: var(--gold);
        }

        .hub-badge {
            font-size: .6rem;
            font-weight: 700;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Statut connexion pill */
        .connection-pill {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: .68rem;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3px 10px;
            transition: color .3s, border-color .3s;
        }

        .connection-pill.connected {
            color: var(--success);
            border-color: rgba(110, 201, 154, .3);
        }

        .connection-pill.disconnected {
            color: var(--alert);
            border-color: rgba(224, 82, 82, .3);
        }

        .conn-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }

        .connection-pill.connected .conn-dot {
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .3
            }
        }

        /* ── Stats bar ───────────────────────────────────────────────────── */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--border);
            border-bottom: 1px solid var(--border);
        }

        .stat-card {
            background: var(--surface);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            text-align: center;
            transition: background .2s;
        }

        .stat-label {
            font-size: .63rem;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            line-height: 1.1;
        }

        .stat-card.alert-state .stat-value {
            color: var(--alert);
        }

        .stat-card.order-state .stat-value {
            color: var(--order);
        }

        .stat-card.tables-state .stat-value {
            color: var(--gold);
        }

        /* Pulse animation sur stat active */
        .stat-card.pulse-active {
            animation: pulse-card 2s infinite;
        }

        @keyframes pulse-card {

            0%,
            100% {
                background: var(--surface);
            }

            50% {
                background: var(--alert-dim);
            }
        }

        .stat-card.order-state.pulse-active {
            animation-name: pulse-card-order;
        }

        @keyframes pulse-card-order {

            0%,
            100% {
                background: var(--surface);
            }

            50% {
                background: var(--order-dim);
            }
        }

        /* ── Navigation Tabs ─────────────────────────────────────────────── */
        .hub-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--border);
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            background: var(--surface-2);
            border: none;
            font-family: var(--font-sans);
            font-size: .78rem;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 13px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            transition: color .2s, background .2s;
        }

        .tab-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gold);
            transform: scaleX(0);
            transition: transform .25s ease;
        }

        .tab-btn.active {
            color: var(--gold);
            background: var(--surface);
        }

        .tab-btn.active::after {
            transform: scaleX(1);
        }

        /* Badge notification tab */
        .tab-badge {
            background: var(--alert);
            color: #fff;
            font-size: .62rem;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            line-height: 1;
            animation: pulse-dot 2s infinite;
        }

        /* ── Viewport & Panels ───────────────────────────────────────────── */
        .hub-viewport {
            flex: 1;
            overflow: hidden;
        }

        .tab-panel {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .tab-panel.active {
            display: flex;
        }

        .panel-section {
            flex: 1;
            padding: 16px 14px calc(16px + var(--safe-bottom));
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .panel-section::-webkit-scrollbar {
            display: none;
        }

        .section-title {
            font-family: var(--font-serif);
            font-size: 1rem;
            font-weight: 600;
            color: var(--gold);
            letter-spacing: .06em;
            margin-bottom: 14px;
        }

        /* ── Feed grid ───────────────────────────────────────────────────── */
        .feed-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ── Alert Cards ─────────────────────────────────────────────────── */
        .alert-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            transition: border-color .2s;
        }

        .call-pending {
            border-color: rgba(224, 82, 82, .35);
            background: linear-gradient(135deg, var(--surface) 80%, rgba(224, 82, 82, .06));
        }

        .call-accepted {
            border-color: rgba(110, 201, 154, .25);
            background: linear-gradient(135deg, var(--surface) 80%, rgba(110, 201, 154, .04));
        }

        .unassigned-card {
            opacity: .55;
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .card-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Zone/Table pill */
        .table-circle {
            background: var(--gold-dim);
            color: var(--gold-light);
            border: 1px solid rgba(201, 169, 110, .25);
            font-family: var(--font-sans);
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .04em;
            padding: 4px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }

        /* Type badges */
        .request-badge {
            font-size: .65rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            padding: 3px 9px;
            border-radius: 20px;
        }

        .badge-waiter {
            background: rgba(201, 169, 110, .15);
            color: var(--gold);
            border: 1px solid rgba(201, 169, 110, .25);
        }

        .badge-water {
            background: rgba(110, 174, 201, .15);
            color: var(--order);
            border: 1px solid rgba(110, 174, 201, .25);
        }

        .badge-bill {
            background: rgba(110, 201, 154, .15);
            color: var(--success);
            border: 1px solid rgba(110, 201, 154, .25);
        }

        .badge-order {
            background: rgba(110, 174, 201, .15);
            color: var(--order);
            border: 1px solid rgba(110, 174, 201, .25);
        }

        /* Elapsed time */
        .time-elapsed {
            font-size: .68rem;
            color: var(--muted);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        /* ── Card Actions ────────────────────────────────────────────────── */
        .card-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .action-btn-accept,
        .action-btn-complete {
            flex: 1;
            font-family: var(--font-sans);
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            border: none;
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            cursor: pointer;
            min-height: 42px;
            transition: opacity .15s, transform .1s;
            -webkit-tap-highlight-color: transparent;
        }

        .action-btn-accept:active,
        .action-btn-complete:active {
            transform: scale(.97);
            opacity: .85;
        }

        .action-btn-accept {
            background: var(--alert);
            color: #fff;
        }

        .action-btn-accept:hover {
            background: #d44;
        }

        .action-btn-complete {
            background: var(--success-dim);
            color: var(--success);
            border: 1px solid rgba(110, 201, 154, .3);
        }

        .action-btn-complete:hover {
            background: rgba(110, 201, 154, .22);
        }

        /* Status badge */
        .accepted-status-badge {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: .75rem;
            font-weight: 600;
            color: var(--success);
        }

        .mini-pulse {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse-dot 2s infinite;
            flex-shrink: 0;
        }

        /* ── Order Items ─────────────────────────────────────────────────── */
        .order-items-list {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            margin: 2px 0 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .order-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: .82rem;
        }

        .item-qty-lbl {
            color: var(--gold);
            font-weight: 700;
            font-size: .75rem;
            min-width: 24px;
        }

        .item-name-lbl {
            color: var(--text);
        }

        .item-price-lbl {
            color: var(--muted);
            font-size: .78rem;
            white-space: nowrap;
        }

        .order-comments {
            font-size: .75rem;
            color: var(--muted);
            border-top: 1px solid var(--border);
            padding-top: 6px;
            margin-top: 2px;
        }

        .order-total-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 8px;
            margin-top: 2px;
            font-size: .8rem;
            font-weight: 600;
            color: var(--muted);
        }

        .order-total-price {
            color: var(--gold);
            font-size: .9rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* ── Empty states ────────────────────────────────────────────────── */
        .feed-empty-state {
            text-align: center;
            padding: 48px 24px;
            font-size: .82rem;
            color: var(--muted);
            font-style: italic;
            letter-spacing: .03em;
        }
    </style>
</head>

<body>

    <div class="app-container">

        <!-- ── Header ─────────────────────────────────────────────────────── -->
        <header class="app-header">
            <div class="header-left">
                <span class="brand-title">Grey Corner</span>
                <span class="hub-badge">Serveur</span>
            </div>

            <div class="header-right">
                <!-- Statut connexion Firebase (piloté depuis waiter.js) -->
                <div class="connection-pill disconnected" id="connectionPill">
                    <span class="conn-dot"></span>
                    <span id="connectionLabel">Connexion...</span>
                </div>
            </div>
        </header>

        <!-- ── Stats Bar ──────────────────────────────────────────────────── -->
        <div class="stats-bar">
            <div class="stat-card tables-state">
                <span class="stat-label">Tables</span>
                <span class="stat-value" id="statMyTables">0</span>
            </div>
            <div class="stat-card alert-state" id="statCardCalls">
                <span class="stat-label">Appels</span>
                <span class="stat-value" id="statActiveCalls">0</span>
            </div>
            <div class="stat-card order-state" id="statCardOrders">
                <span class="stat-label">Commandes</span>
                <span class="stat-value" id="statActiveOrders">0</span>
            </div>
        </div>

        <!-- ── Navigation Tabs ────────────────────────────────────────────── -->
        <nav class="hub-tabs">
            <button class="tab-btn active" data-tab="tabCalls">
                <span>Appels clients</span>
                <span class="tab-badge" id="badgeTabCalls" style="display:none;">0</span>
            </button>
            <button class="tab-btn" data-tab="tabOrders">
                <span>Précommandes</span>
                <span class="tab-badge" id="badgeTabOrders" style="display:none;">0</span>
            </button>
            <button class="tab-btn" data-tab="tabHistory">
                <span>Historique</span>
            </button>
        </nav>

        <!-- ── Tab Panels ─────────────────────────────────────────────────── -->
        <main class="hub-viewport">

            <!-- 1. Appels clients -->
            <section class="tab-panel active" id="tabCalls">
                <div class="panel-section">
                    <h3 class="section-title">Demandes en Direct</h3>
                    <div class="feed-grid" id="callsFeed">
                        <div class="feed-empty-state">Chargement...</div>
                    </div>
                </div>
            </section>

            <!-- 2. Précommandes -->
            <section class="tab-panel" id="tabOrders">
                <div class="panel-section">
                    <h3 class="section-title">Commandes en attente de validation</h3>
                    <div class="feed-grid" id="ordersFeed">
                        <div class="feed-empty-state">Chargement...</div>
                    </div>
                </div>
            </section>

            <!-- 3. Historique -->
            <section class="tab-panel" id="tabHistory">
                <div class="panel-section">
                    <h3 class="section-title">Historique de la journée</h3>
                    <div class="feed-grid" id="historyFeed">
                        <div class="feed-empty-state">Aucun historique pour le moment.</div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- ── Firebase SDK ────────────────────────────────────────────────────── -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <!-- Waiter Logic -->
    <script src="waiter.js"></script>
</body>

</html>
